<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百科盒 BaikeBox</title>
<style>
  :root {
    --ink: #2b2620;
    --ink-light: #6f675c;
    --paper: #f6f2e7;
    --card: #fffdf6;
    --red: #a4342a;
    --red-soft: #c8554a;
    --gold: #b98a2f;
    --blue: #5f7d95;
    --line: #e4dcc8;
    --mark: #ffe9a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--paper);
    background-image: radial-gradient(#e9e2cf 0.8px, transparent 0.8px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 32px 18px 60px; }

  header { text-align: center; margin-bottom: 18px; position: relative; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
  h1 {
    font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
    font-size: 40px; letter-spacing: 10px; text-indent: 10px;
    color: var(--ink); font-weight: 700;
  }
  .seal {
    width: 44px; height: 44px; border-radius: 8px;
    background: var(--red); color: #fff8ec;
    font-family: "KaiTi", "STKaiti", serif; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 2px 3px 0 rgba(164,52,42,.25);
    transform: rotate(4deg);
  }
  .stats { margin-top: 10px; color: var(--ink-light); font-size: 13px; letter-spacing: 1px; }
  .stats b { color: var(--red); font-weight: 600; }

  .hbtns { position: absolute; top: -8px; right: 0; display: flex; gap: 8px; }
  .hbtns button {
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 20px; padding: 8px 14px;
    font-size: 13.5px; color: var(--ink-light); letter-spacing: 1px;
  }
  .hbtns button:hover { border-color: var(--gold); color: var(--gold); }
  #favBtn .n {
    display: inline-block; min-width: 18px; text-align: center;
    background: var(--red); color: #fff8ec; border-radius: 10px;
    font-size: 11.5px; padding: 1px 5px; margin-left: 2px; font-weight: 600;
  }

  /* 词典切换标签 */
  .tabs { display: flex; justify-content: center; gap: 6px; margin: 16px 0 18px; }
  .tab {
    background: none; padding: 8px 22px; font-size: 16.5px;
    font-family: "KaiTi", "STKaiti", serif; letter-spacing: 3px;
    color: var(--ink-light); border-bottom: 2.5px solid transparent; border-radius: 6px 6px 0 0;
    transition: color .25s, border-bottom-color .25s, transform .2s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--red); font-weight: 700; border-bottom-color: var(--red); transform: translateY(-1px); }
  /* 页签切换动画：内容淡入上滑级联 */
  @keyframes tabIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tab-fade { animation: tabIn .38s ease both; }
  @media (prefers-reduced-motion: reduce) {
    .tab-fade { animation: none; }
    .tab { transition: none; }
  }

  .searchbar { display: flex; gap: 10px; margin-bottom: 10px; }
  .qwrap { position: relative; flex: 1; display: flex; }
  #q {
    flex: 1; font-size: 17px; padding: 13px 40px 13px 16px;
    border: 2px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #qClear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 4px 5px;
    font-size: 14px; line-height: 1; cursor: pointer; color: #b3a992;
    opacity: 0; transition: opacity .25s ease, color .15s;
  }
  .qwrap:hover #q:not(:placeholder-shown) + #qClear { opacity: 1; }
  #qClear:hover { color: var(--red); }
  #q:focus { border-color: var(--red-soft); box-shadow: 0 0 0 3px rgba(200,85,74,.12); }
  #q::placeholder { color: #b3a992; }
  button {
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 15px; padding: 0 20px; white-space: nowrap;
    transition: transform .08s, filter .15s;
  }
  button:active { transform: scale(.96); }
  #go { background: var(--red); color: #fff8ec; font-weight: 600; letter-spacing: 2px; }
  #go:hover { filter: brightness(1.08); }
  #random { background: var(--card); border: 2px solid var(--line); color: var(--ink-light); }
  #random:hover { border-color: var(--gold); color: var(--gold); }

  .hint { text-align: center; color: #a2987f; font-size: 12.5px; margin-bottom: 22px; }
  .hint code { background: #efe8d4; border-radius: 4px; padding: 1px 6px; font-family: Consolas, monospace; }
  .lchip {
    display: inline-block; background: #efe8d4; color: #82724c;
    font-size: 12.5px; padding: 4px 12px; border-radius: 14px;
    text-decoration: none;
  }
  .lchip:hover { background: #e8dfc8; color: #82724c; }

  .star {
    background: none; border: none; padding: 0 2px;
    font-size: 17px; line-height: 1; color: #cfc4a6;
  }
  .star:hover { color: var(--gold); transform: scale(1.15); }
  .star.on { color: #e8a020; }

  /* 考试标签 */
  .chip {
    display: inline-block; font-size: 11px; border-radius: 4px;
    background: #efe8d4; color: #82724c; padding: 1px 6px; margin: 0 4px 0 0;
    white-space: nowrap; vertical-align: 1px;
  }
  .chip.r-high { background: #f5d9d3; color: #a4342a; }
  .chip.r-mid { background: #f3e7c3; color: #8a6d1f; }
  .chip.r-low { background: #dde8d4; color: #49653f; }

  /* 控糖计算器 */
  #calcWrap { margin-top: 16px; }
  .calc-card { margin-bottom: 24px; }
  .calc-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 4px; align-items: center; }
  .calc-row label { font-size: 13.5px; color: var(--ink-light); display: flex; align-items: center; gap: 6px; }
  .calc-row input, .calc-row select {
    border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 15px; background: var(--card); color: var(--ink); width: 100px; outline: none;
    font-family: inherit;
  }
  .calc-row input:focus, .calc-row select:focus { border-color: var(--red-soft); }
  #calcBtn { background: var(--red); color: #fff8ec; padding: 9px 18px; font-size: 14px; letter-spacing: 2px; }
  .calc-result { margin-top: 12px; font-size: 14.5px; line-height: 2; color: #4c453b; }
  .calc-result .num { color: var(--red); font-size: 24px; font-weight: 700; }
  .calc-result .st { color: var(--red-soft); font-weight: 700; }
  .calc-result .advice { display: block; color: var(--ink-light); }
  .calc-result .warn { display: block; margin-top: 6px; color: #b3a98f; font-size: 12px; }

  /* 菜系筛选条 */
  .fbar { margin: 0 0 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .fchip { cursor: pointer; font-size: 12.5px; padding: 4px 12px; border-radius: 14px; margin: 0; }
  .fchip:hover { background: #e8dfc8; }
  .fchip.active { background: var(--red); color: #fff8ec; }

  /* 份量选择条（菜谱页顶部，全局生效） */
  .pbar { margin: -6px 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  #extra:not(:empty) { margin-bottom: 14px; }   /* 工具条下方给卡片凸出的标签留空间 */
  .plab { font-size: 13.5px; color: var(--ink-light); letter-spacing: 1px; margin-right: 2px; }
  .pbtn {
    background: #efe8d4; border: none; color: #82724c;
    font-size: 12.5px; padding: 4px 12px; border-radius: 14px;
  }
  .pbtn:hover { background: #e8dfc8; }
  .pbtn.on { background: var(--red); color: #fff8ec; }
  .pnote { color: #a2987f; font-size: 12px; margin-left: 4px; }
  .rsel {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 8px;
    font-size: 13px; background: var(--card); color: var(--ink); outline: none; font-family: inherit;
  }
  .rsel:focus { border-color: var(--red-soft); }
  .dbtn {
    margin-left: auto; background: var(--red); border: 1.5px solid var(--red);
    color: #fff8ec; font-size: 12.5px; padding: 4px 14px; border-radius: 14px; letter-spacing: 1px;
  }
  .dbtn:hover { filter: brightness(1.08); }
  .padd {
    margin-left: 10px; background: none; border: 1.5px solid var(--line);
    color: var(--ink-light); font-size: 12px; padding: 2px 10px; border-radius: 12px;
    white-space: nowrap;
  }
  .padd:hover { border-color: var(--red); color: var(--red); }
  .chip.kcal { background: #f5d9d3; color: #a4342a; }

  /* 英汉词典增强：朗读按钮 / 可点词块 */
  .spk { background: none; border: none; padding: 0 2px; font-size: 14px; cursor: pointer; }
  .spk:hover { transform: scale(1.18); }
  .word .spk { font-size: 19px; margin-left: 10px; vertical-align: 10px; }
  .wchip {
    display: inline-block; font-size: 11px; border-radius: 4px; cursor: pointer;
    background: #efe8d4; color: #82724c; padding: 1px 6px; margin: 0 4px 2px 0; border: none;
  }
  .wchip:hover { background: var(--red); color: #fff8ec; }
  /* 成语接龙 */
  .jl-chain { font-size: 15px; line-height: 2.2; margin-bottom: 4px; }
  .jl-arrow { color: #c9bfa4; margin: 0 4px; }
  .jl-need { margin: 8px 0; font-size: 14.5px; color: #4c453b; }
  .jl-char {
    font-family: "KaiTi", "STKaiti", serif; font-size: 30px;
    color: var(--red); font-weight: 700; margin: 0 2px;
  }
  .jl-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
  .jl-hints { margin: 6px 0 2px; line-height: 2.1; color: #82724c; }
  .jl-note { margin-top: 8px; color: var(--red); font-size: 13.5px; }
  .jl-head {
    background: none; border: 1px dashed #c9bfa4; color: #82724c;
    font-size: 11px; padding: 1px 6px; border-radius: 10px; cursor: pointer; margin-left: 3px;
  }
  .jl-head:hover { border-color: var(--red); color: var(--red); background: #fbf3e4; }
  .jl-link.jl-me { border: 1px solid var(--red); color: var(--red); background: #fffdf6; }
  .jl-link.jl-me:hover { background: var(--red); color: #fff8ec; }
  .fav-top .cnt { margin-right: 10px; color: var(--ink-light); font-size: 13px; }
  .fav-top .cnt b { color: var(--red); }
  .wexp {
    margin: 6px 0 2px; padding: 8px 12px;
    background: #f7f1df; border: 1px dashed var(--line); border-radius: 8px;
    font-size: 13.5px; line-height: 1.8;
  }
  .wexp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .wexp-head b { font-family: Georgia, "Times New Roman", serif; font-size: 15px; }
  .wexp-head .p { color: var(--gold); font-size: 12px; }
  .wexp-x { margin-left: auto; background: none; border: none; color: #a2987f; cursor: pointer; font-size: 13px; padding: 0 4px; }
  .wexp-x:hover { color: var(--red); }
  .wexp .txt { color: #4c453b; }

  /* 灯箱档位缩放 */
  #imgZoom img { transition: transform .18s ease; }
  .zoom-hint {
    position: absolute; bottom: 14px; left: 0; width: 100%; text-align: center;
    color: rgba(255,248,236,.85); font-size: 12.5px; letter-spacing: 1px; pointer-events: none;
  }
  .zoom-x {
    position: absolute; top: 14px; right: 18px;
    background: rgba(255,248,236,.12); border: 1px solid rgba(255,248,236,.4);
    color: #fff8ec; font-size: 15px; padding: 5px 12px; border-radius: 16px; cursor: pointer;
  }
  .zoom-x:hover { background: rgba(255,248,236,.28); }

  /* 冰箱模式（按食材找菜） */
  .fbtn {
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink-light);
    font-size: 12.5px; padding: 4px 14px; border-radius: 14px; letter-spacing: 1px;
  }
  .fbtn:hover { border-color: var(--gold); color: var(--gold); }
  .fbtn.on { background: #7ba05b; border-color: #7ba05b; color: #fff8ec; }
  .ingbar { margin: 0 0 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ingbar #ingFilter {
    flex: 1; min-width: 140px; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font-size: 14px; background: var(--card); color: var(--ink);
    outline: none; font-family: inherit;
  }
  .ingbar #ingFilter:focus { border-color: var(--red-soft); }
  .ingchips { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .gchip {
    cursor: pointer; font-size: 12.5px; padding: 4px 12px; border-radius: 14px; margin: 0;
    background: #efe8d4; border: none; color: #82724c;
  }
  .gchip:hover { background: #e8dfc8; }
  .gchip.active { background: var(--red); color: #fff8ec; }
  .gchip i { font-style: normal; color: #b3a98f; margin-left: 3px; font-size: 11px; }
  .gchip.active i { color: #f3d9c9; }
  .ingnote { color: #a2987f; font-size: 12px; align-self: center; }

  /* 今日控糖 */
  .dia-date { margin-right: auto; color: var(--ink-light); font-size: 13px; }
  .dia-budget { font-size: 13.5px; color: var(--ink-light); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dia-budget input {
    border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px;
    font-size: 14px; background: var(--card); color: var(--ink); width: 90px; outline: none; font-family: inherit;
  }
  .dia-budget input:focus { border-color: var(--red-soft); }
  .dia-budget button {
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink-light);
    font-size: 13px; padding: 6px 12px; border-radius: 8px;
  }
  .dia-budget button:hover { border-color: var(--gold); color: var(--gold); }
  .dia-big { font-size: 14.5px; margin: 10px 0 8px; color: #4c453b; }
  .dia-big .num { color: var(--red); font-size: 24px; font-weight: 700; }
  .dia-track { height: 10px; background: #efe8d4; border-radius: 6px; overflow: hidden; }
  .dia-fill { height: 100%; width: 0; background: #7ba05b; border-radius: 6px; transition: width .3s; }
  .dia-fill.warn { background: #c89a3f; }
  .dia-fill.hot { background: var(--red); }
  .dia-meal { margin-top: 16px; }
  .dia-meal h3 {
    display: inline; font-family: "KaiTi", "STKaiti", serif;
    font-size: 17.5px; letter-spacing: 2px; margin-right: 8px;
  }
  .dia-meal .mtot { color: #a2987f; font-size: 12.5px; }
  .dia-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: #4c453b; padding: 5px 0;
    border-bottom: 1px dashed #e5dcc3;
  }
  .dia-item .k { margin-left: auto; color: #82724c; font-size: 13px; white-space: nowrap; }
  .dia-x { background: none; border: none; color: #c2b696; font-size: 13px; padding: 2px 4px; }
  .dia-x:hover { color: var(--red); }
  .dia-add { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .mchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .dia-add input {
    flex: 1; border: 1.5px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; background: var(--card); color: var(--ink);
    outline: none; font-family: inherit; min-width: 0;
  }
  .dia-add input:focus { border-color: var(--red-soft); }
  .dia-add button {
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink-light);
    font-size: 13px; padding: 0 14px; border-radius: 8px;
  }
  .dia-add button:hover { border-color: var(--gold); color: var(--gold); }
  .dia-note { margin-top: 16px; color: #b3a98f; font-size: 12px; line-height: 1.8; }

  /* 图片放大灯箱 */
  #imgZoom {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: rgba(43,38,32,.78); cursor: zoom-out;
    align-items: center; justify-content: center; padding: 20px;
  }
  #imgZoom.show { display: flex; }
  #imgZoom img {
    max-width: 96vw; max-height: 96vh;
    border-radius: 10px; border: 1px solid var(--line);
    box-shadow: 0 12px 40px rgba(40,30,10,.45); background: #efe8d4;
  }
  .dia-menu {
    margin-top: 16px; background: #fbf6e8; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px;
  }
  .dia-menu-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dia-menu-top h3 {
    margin-right: auto; font-family: "KaiTi", "STKaiti", serif;
    font-size: 17px; letter-spacing: 2px;
  }
  .dia-menu-top button {
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink-light);
    font-size: 12.5px; padding: 5px 10px; border-radius: 8px;
  }
  .dia-menu-top button:hover { border-color: var(--gold); color: var(--gold); }
  .dia-meal-line { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: #4c453b; padding: 3px 0; }
  .dia-meal-line b { color: var(--red-soft); letter-spacing: 1px; }
  .dia-meal-line .mk { margin-left: auto; color: #82724c; font-size: 12.5px; white-space: nowrap; }
  .dia-menu-total {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e0d6bb;
    font-size: 13px; color: var(--red);
  }
  .dia-menu-empty { color: #a2987f; font-size: 13px; padding: 4px 0; }

  /* 今日/随机卡片 */
  .feature-card {
    display: flow-root;
    background: linear-gradient(160deg, #fffdf6 0%, #fbf6e8 100%);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 24px 26px; margin-bottom: 24px; position: relative;
    box-shadow: 0 4px 14px rgba(120,100,60,.08);
  }
  .feature-card .tag {
    position: absolute; top: -11px; left: 20px;
    background: var(--red); color: #fff8ec; font-size: 12px;
    padding: 3px 12px; border-radius: 20px; letter-spacing: 2px;
  }
  .feature-card .star { position: absolute; top: 14px; right: 16px; font-size: 22px; }
  .feature-card .word {
    font-family: "KaiTi", "STKaiti", serif; font-size: 34px; font-weight: 700;
    letter-spacing: 6px; margin: 6px 0 4px;
  }
  .feature-card .word.en { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0; font-size: 32px; }
  .feature-card .py { color: var(--gold); font-size: 15px; margin-bottom: 12px; letter-spacing: .5px; }
  .feature-card .sec { margin-top: 10px; font-size: 14.5px; line-height: 1.9; }
  .feature-card .sec .lab {
    display: inline-block; min-width: 44px; color: #fff; background: var(--gold);
    font-size: 12px; text-align: center; border-radius: 4px; padding: 1px 0; margin-right: 10px;
  }
  .feature-card .sec.der .lab { background: var(--red-soft); }
  .feature-card .sec.exa .lab { background: #7a8b6f; }
  .feature-card .sec.exc .lab { background: var(--blue); }
  .feature-card .sec .txt { color: #4c453b; }

  /* 搜索结果 */
  #meta { color: var(--ink-light); font-size: 13.5px; margin: 0 2px 12px; }
  #meta b { color: var(--red); }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 10px; overflow: hidden; cursor: pointer;
    transition: box-shadow .15s, border-color .15s;
  }
  .item:hover { border-color: #d8b98a; box-shadow: 0 3px 10px rgba(120,100,60,.1); }
  .item .head { display: flex; align-items: baseline; gap: 12px; padding: 13px 18px; }
  .rthumb {
    align-self: center; flex: none;
    width: 58px; height: 44px; object-fit: cover;
    border-radius: 6px; border: 1px solid var(--line);
    background: #efe8d4;
  }
  .dwrap { position: relative; float: right; width: 46%; margin: 4px 0 8px 14px; }
  .dwrap.big { float: none; width: 100%; margin: 10px 0 2px; }
  .dthumb {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover;
    border-radius: 10px; border: 1px solid var(--line);
    background: #efe8d4; cursor: zoom-in;
  }
  .dsmall {
    position: absolute; top: 8px; right: 8px;
    background: rgba(43,38,32,.55); border: 1px solid rgba(255,248,236,.5);
    color: #fff8ec; font-size: 11.5px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
    letter-spacing: 1px;
  }
  .dsmall:hover { background: rgba(43,38,32,.85); }
  @media (max-width: 560px) {
    .dthumb { aspect-ratio: 4 / 3; }
    .dwrap { float: none; width: 80%; margin: 10px auto 2px; }
    .dwrap.big { width: 100%; margin: 10px 0 2px; }
  }
  .item .w { font-family: "KaiTi", "STKaiti", serif; font-size: 21px; font-weight: 700; letter-spacing: 2px; }

<script>
(function () {
  var PAGE = 100;
  var P_LABEL = { plate: '一盘', bowl: '一碗', small: '一小碗' };
  var PORTION = 'plate';

  try {
    var savedP = localStorage.getItem('recipe_portion');

  } catch (e) {}

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function normPy(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '');

    text = esc(text);

      return text.replace(new RegExp(rxQuote(esc(rawQ)), 'gi'), function (m) {
        return '<mark' + (cls ? ' class="' + cls + '"' : '') + '>' + m + '</mark>';
      });
    } catch (e) { return text; }
  }
  function toBr(s) { return esc(s).replace(/\n/g, '<br>'); }
  function firstLine(s, n) {
    var i = s.indexOf('\n');
    var line = i >= 0 ? s.slice(0, i) : s;
    return line.length > n ? line.slice(0, n) + '…' : line;
  }

  /* ================= 词典定义 ================= */
  var IDIOMS = window.IDIOMS || [];
  var ENG = window.ENGWORDS || [];
  var FLOWERS = window.FLOWERS || [];

  var RARE_F = { r: '', s: 0, str: '', p1: '', p2: '' };
  var DECOMP = window.RARE_DECOMP || {};
  var DSET = window.RARE_DSET || {};
  function partOk(part, p) {
    if (Array.isArray(part)) {
      for (var i = 1; i < part.length; i++) {
        if (partOk(part[i], p)) return true;
      }
      return false;
    }
    return part === p || (!!DSET[part] && DSET[part].indexOf(p) >= 0);
  }
  function rareScore(it) {
    if (RARE_F.r && it[2] !== RARE_F.r) return 0;
    if (RARE_F.s && it[3] !== RARE_F.s) return 0;
    var ps = [RARE_F.p1, RARE_F.p2, RARE_F.p3];
    if (!ps[0] && !ps[1] && !ps[2]) return 1;
    var d = DECOMP[it[0]];
    var set = DSET[it[0]] || '';
    var loose = 0;
    for (var k = 0; k < 3; k++) {
      if (ps[k] && set.indexOf(ps[k]) >= 0) loose++;
    }
    if (!d) return loose > 0 ? 1 : 0;
    var pos = 0;
    for (var i = 0; i < 3; i++) {
      if (ps[i] && d.length > i + 1 && partOk(d[i + 1], ps[i])) pos++;
    }
    var structOk = !RARE_F.str || d[0] === RARE_F.str;
    if (structOk && pos === 3 && ps[2]) return 4;   // 结构+三位置全对
    if (structOk && pos === 2 && !ps[2]) return 4;  // 结构+两位置全对
    if (pos === 2 && !ps[2]) return 3;              // 两位置全对，结构不同
    if (structOk && pos >= 1) return 2;             // 结构对，部分位置对
    return loose > 0 ? 1 : 0;                        // 只是包含部件
  }
  var RARE_RAD = (function () {
    var rc = {};
    RARE.forEach(function (it) { if (it[2]) rc[it[2]] = (rc[it[2]] || 0) + 1; });
    return Object.keys(rc).sort(function (a, b) { return rc[b] - rc[a]; });
  })();
  var THUMB_MAPS = { recipe: window.RECIPE_THUMBS || {}, flower: window.FLOWER_THUMBS || {}, food: window.FOOD_THUMBS || {} };
  function thumbImg(k, name, cls) {
    var map = THUMB_MAPS[k];
    var src = map ? map[name] : '';
    if (!src) return '';
    var img = '<img class="' + cls + '" src="' + src + '" alt="' + esc(name) + '" loading="lazy"' +
      (cls === 'dthumb' ? ' title="点击放大"' : '') + ' onerror="this.style.display=\'none\'">';
    if (cls !== 'dthumb') return img;
    return '<div class="dwrap">' + img +
      '<button class="dsmall" title="还原为全宽大图">放 大</button></div>';
  }

  var EX_CN = { zk: '中考', gk: '高考', cet4: 'CET4', cet6: 'CET6', ky: '考研', toefl: 'TOEFL', ielts: '雅思', gre: 'GRE' };
  function chips(tagStr, limit) {
    if (!tagStr) return '';
    var arr = tagStr.split(' ');
    if (limit) arr = arr.slice(0, limit);
    return arr.map(function (t) { return '<span class="chip">' + (EX_CN[t] || t) + '</span>'; }).join('');
  }

  var IDIOM_PY = IDIOMS.map(function (it) { return normPy(it[1]); });
  var ENG_LOW = ENG.map(function (it) { return it[0].toLowerCase(); });

  /* ================= 英汉增强：朗读 / 关联词 / 拼写相近 / 例句 ================= */
  function speak(word) {
    try {
      if (!window.speechSynthesis) return;
      var u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.85;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function ed(a, b, cap) {          // 编辑距离，超过 cap 提前退出
    if (a === b) return 0;
    var m = a.length, n = b.length, i, j;
    var prev = [], cur = [];
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      var best = i;
      for (j = 1; j <= n; j++) {
        var c = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
        if (cur[j] < best) best = cur[j];
      }
      if (best > cap) return cap + 1;
      for (j = 0; j <= n; j++) prev[j] = cur[j];
    }
    return prev[n];
  }
  function engFamily(word) {        // 关联词：同词头（词根家族），按词频序
    var pre = word.slice(0, Math.max(4, word.length - 2));
    var out = [];
    for (var i = 0; i < ENG.length && out.length < 10; i++) {
      if (ENG_LOW[i] !== word && ENG_LOW[i].indexOf(pre) === 0) out.push(ENG[i][0]);
    }
    return out;
  }
  function engSimilar(word) {       // 拼写相近：编辑距离 ≤ 1/2
    var maxd = word.length <= 4 ? 1 : 2;
    var out = [];
    for (var i = 0; i < ENG.length && out.length < 8; i++) {
      var w = ENG_LOW[i];
      if (w === word || Math.abs(w.length - word.length) > maxd) continue;
      if (ed(w, word, maxd) <= maxd) out.push(ENG[i][0]);
    }
    return out;
  }
  function wchip(w) { return '<button class="chip wchip" data-sw="' + esc(w) + '" title="点击展开释义，不跳转">' + esc(w) + '</button>'; }
  function wexpHTML(word) {         // 原地展开某词的释义/例句，不离开当前页面
    var idx = wordIdx.eng[word];
    if (idx === undefined) return '';
    var it = DICTS.eng.items[idx];
    var ex = (window.ENG_SENT || {})[word];
    var h = '<div class="wexp" data-for="' + esc(word) + '"><div class="wexp-head">' +
      '<b>' + esc(it[0]) + '</b>' +
      (it[1] ? '<span class="p">/' + esc(it[1]) + '/</span>' : '') +
      '<button class="spk" data-w="' + esc(word) + '" title="朗读发音">🔊</button>' +
      '<button class="wexp-x" title="收起">✕</button></div>' +
      '<div class="txt">' + toBr(it[2]) + '</div>';
    if (ex) {
      var p = ex.split('\n');
      h += '<div class="txt" style="color:#82724c">' + esc(p[0]) + (p[1] ? '<br>' + esc(p[1]) : '') + '</div>';
    }
    return h + '</div>';
  }
  function engExtraHTML(word) {
    var h = '';
    var ex = (window.ENG_SENT || {})[word];
    if (ex) {
      var parts = ex.split('\n');
      h += '<div class="sec"><span class="lab l-exa">例 句</span><span class="txt">' + esc(parts[0]) +
        (parts[1] ? '<br><span style="color:#82724c">' + esc(parts[1]) + '</span>' : '') + '</span></div>';
    }
    var fam = engFamily(word);
    if (fam.length) h += '<div class="sec"><span class="lab l-exc">关联词</span>' + fam.map(wchip).join('') + '</div>';
    var sim = engSimilar(word);
    if (sim.length) h += '<div class="sec"><span class="lab l-der">拼写相近</span>' + sim.map(wchip).join('') + '</div>';
    return h;
  }
  document.addEventListener('click', function (e) {   // 朗读（捕获阶段，避免触发行展开/翻卡）
    var s = e.target.closest ? e.target.closest('.spk') : null;

  }, true);
  document.addEventListener('click', function (e) {   // 点击关联词/相近词：原地展开，再点收起
    if (!e.target.closest) return;

    if (x) {
      var w = x.closest('.wexp');
      if (w) w.remove();

    }
    var c = e.target.closest('.wchip');
    if (!c || !c.dataset.sw) return;
    e.stopPropagation();
    var word = c.dataset.sw;
    var sec = c.closest('.sec');
    if (!sec) return;
    var next = sec.nextElementSibling;
    if (next && next.classList.contains('wexp') && next.getAttribute('data-for') === word) { next.remove(); return; }
    var root = c.closest('.item') || c.closest('.feature-card') || c.closest('.fc-face') || document.body;
    root.querySelectorAll('.wexp').forEach(function (n) { n.remove(); });
    var html = wexpHTML(word);
    if (html) sec.insertAdjacentHTML('afterend', html);
  });

  var DICTS = {
    idiom: {
      key: 'idiom', book: '📖', label: '成语', favFile: '成语收藏本',
      items: IDIOMS, favKey: 'idiom_favs',
      placeholder: '查成语、释义关键词，或拼音缩写（如 xycc）',
      hint: '试试：<code>画蛇添足</code>（成语）· <code>形容刻苦</code>（释义）· <code>xycc</code>（拼音缩写）· 点 <code>☆</code> 收进收藏本',
      emptyMsg: '没找到相关成语，换个关键词试试？',
      countText: function () { return IDIOMS.length.toLocaleString() + ' 条成语'; },
      extra: function () {
        return '<div class="pbar"><button class="fbtn" id="jlToggle">🔗 成语接龙</button>' +
          '<span class="pnote">系统自动出题，你往下接；接不上可以让系统帮忙</span></div>' +
          '<div id="jlWrap" style="display:none"><div class="feature-card" id="jlCard"></div></div>';
      },
      afterExtra: function () {
        var tg = document.getElementById('jlToggle');
        if (tg) tg.addEventListener('click', function () {
          var w = document.getElementById('jlWrap');
          var open = w.style.display !== 'none';
          w.style.display = open ? 'none' : '';
          tg.classList.toggle('on', !open);
          if (!open) jlInit();

      },
      score: function (it, i, q, nq, isAscii) {
        var s = -1;
        if (it[0] === q) s = 100;
        else if (isAscii && it[5] === nq) s = 95;
        else if (it[0].indexOf(q) === 0) s = 80;
        else if (isAscii && IDIOM_PY[i] === nq) s = 78;
        else if (it[0].indexOf(q) > 0) s = 60;
        else if (isAscii && nq.length >= 2 && it[5].indexOf(nq) === 0) s = 50;
        else if (it[3].indexOf(q) >= 0) s = 40;
        else if (isAscii && nq.length >= 3 && IDIOM_PY[i].indexOf(nq) >= 0) s = 30;

      },
      head: function (it, raw) {

      },

          (it[3] ? '<div class="sec"><span class="lab l-der">出 处</span><span class="txt">' + esc(it[3]) + '</span></div>' : '') +
          (it[4] ? '<div class="sec"><span class="lab l-exa">例 句</span><span class="txt">' + esc(it[4]) + '</span></div>' : '');
      },

        return '<div class="word">' + esc(it[0]) + '</div>' +
          '<div class="py">' + esc(it[1]) + '</div>' +
          '<div class="flip-hint">先自己回想意思，再点击卡片翻面</div>';
      },
      back: function (it) { return this.body(it); },
      detail: function (it) {

  function portionCalc(it, unit) {

  }
  function portionWeight(it, unit) {
    var cat = it[2];
    if (unit === 'small') return cat === '汤羹' ? 250 : 120;
    if (unit === 'bowl') return cat === '汤羹' ? 500 : 250;
    if (cat === '汤羹' || cat === '蒸菜') return 400;
    if (cat === '甜点饮品') return 200;
    return 300;
  }
  // 按菜系做法粗估每100克的能量密度（千卡）
  function dishDensity(it) {
    var cat = it[2], name = it[0], text = it[0] + it[4] + it[5];
    if (cat === '甜点饮品') return 200;
    if (cat === '汤羹' || /汤$/.test(name)) {
      return /排骨|牛|羊|鸭|猪蹄|鸡/.test(name) ? 90 : 50;
    }
    if (/粥/.test(name)) return 55;
    if (cat === '主食') return /炒|河粉|烩|焖/.test(text) ? 170 : 135;
    if (/拔丝|锅包|酥|炸/.test(text)) return 250;
    if (/红烧|糖醋|油焖|回锅|干煸|咖喱|水煮|鱼香|麻辣/.test(text)) return 185;
    if (/清蒸|白灼|蒸蛋/.test(text)) return 110;
    if (cat === '凉菜' || /凉拌/.test(text)) {
      return /鸡|肉|牛/.test(it[0] + it[4]) ? 160 : 60;
    }
    return /肉|鸡|鸭|鱼|虾|排骨|牛|羊|蛋/.test(it[4]) ? 140 : 90;
  }

  var ID_FIRST = {};

  function jlStart() {
    for (var t = 0; t < 30; t++) {

  var $diaOverlay = document.getElementById('diaOverlay');

  function diaToday() {
    var t = new Date();
    return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate();

  function saveDiary() {
    diary.date = diaToday();

  function diaRoll() {          // 跨天自动清空餐点，保留热量上限设置

  }

    var kcal = 0, n = 0;

    });
    return { kcal: kcal, n: n };
  }
  function diaMealByTime() {   // 仅作添加栏的默认预选，用户可点餐次切换
    var h = new Date().getHours();
    return h < 10 ? 'bf' : (h < 15 ? 'lc' : (h < 21 ? 'dn' : 'sk'));
  }
  var diaTarget = 'lc';
  function openDiary() { diaRoll(); diaTarget = diaMealByTime(); renderDiary(); $diaOverlay.classList.add('show'); }

  function diaAdd() {
    var inp = document.getElementById('dia-add');
    var name = (inp ? inp.value : '').trim();
    if (!name) { if (inp) inp.focus(); return; }
    var hit = null, i;
    for (i = 0; i < RECIPES.length; i++) if (RECIPES[i][0] === name) { hit = RECIPES[i]; break; }
    if (!hit) for (i = 0; i < RECIPES.length; i++) if (RECIPES[i][0].indexOf(name) >= 0) { hit = RECIPES[i]; break; }
    if (!hit) {
      if (inp) { inp.value = ''; inp.placeholder = '没找到「' + name + '」，换个菜名试试'; }
      return;
    }

  /* ================= 冰箱模式（按食材找菜） ================= */
  function normIng(t) {
    return t.replace(/[0-9零一二两三四五六七八九十百半]+[大小]?(克|g|G|斤|两|毫升|ml|ML|个|只|条|根|片|颗|罐|把|勺|碗|朵|瓣|块|包|盒|杯|张|枚|段|滴|撮)/g, '')
      .replace(/适量|少许|若干/g, '').trim();
  }
  function parseIng(s) {
    var out = [];
    s.split('、').forEach(function (t) {
      t = normIng(t.trim());
      if (t && out.indexOf(t) < 0) out.push(t);
    });
    return out;
  }
  var ING_LIST = [], ING_MAP = {};
  RECIPES.forEach(function (it, i) {
    parseIng(it[4]).forEach(function (g) {
      if (!ING_MAP[g]) { ING_MAP[g] = []; ING_LIST.push(g); }
      if (ING_MAP[g].indexOf(i) < 0) ING_MAP[g].push(i);
    });
  });
  ING_LIST.sort(function (a, b) { return ING_MAP[b].length - ING_MAP[a].length; });
  var ING_SYN = {
    '西红柿': ['番茄'], '番茄': ['西红柿'],
    '土豆': ['马铃薯', '洋芋'], '马铃薯': ['土豆'], '洋芋': ['土豆'],
    '卷心菜': ['包菜', '圆白菜'], '包菜': ['卷心菜', '圆白菜'], '圆白菜': ['包菜', '卷心菜'],
    '青椒': ['菜椒', '甜椒', '柿子椒'], '菜椒': ['青椒'], '柿子椒': ['青椒'],
    '蒜苗': ['青蒜'], '青蒜': ['蒜苗'],
    '鸡蛋': ['蛋清', '蛋白'], '蛋清': ['鸡蛋', '蛋白'], '蛋白': ['蛋清', '鸡蛋'],
    '瘦猪肉': ['猪里脊', '里脊'], '猪里脊': ['瘦肉'],
    '白糖': ['糖', '砂糖'], '冰糖': ['糖'], '红糖': ['糖']
  };

  function ingBarHTML() {
    return '<div class="ingbar"><span class="plab">食 材</span>' +
      '<input id="ingFilter" autocomplete="off" placeholder="搜食材，如 排骨">' +
      '<button class="gchip" data-c="1">清空</button>' +
      '<button class="gchip" data-x="1">✕ 退出冰箱模式</button>' +
      '<div id="ingchips" class="ingchips"></div></div>';
  }
  function renderIngChips(f) {
    var box = document.getElementById('ingchips');
    if (!box) return;
    f = (f || '').trim();
    var html = Object.keys(FRIDGE_SEL).map(function (g) {
      return '<button class="gchip active" data-g="' + esc(g) + '">' + esc(g) + '</button>';
    }).join('');
    var shown = 0, MAX = f ? 80 : 48;
    for (var i = 0; i < ING_LIST.length && shown < MAX; i++) {
      var g = ING_LIST[i];
      if (FRIDGE_SEL[g]) continue;
      if (f && g.indexOf(f) < 0) {
        var syns = ING_SYN[g] || [], hitS = false;
        for (var y = 0; y < syns.length; y++) if (syns[y].indexOf(f) >= 0) { hitS = true; break; }
        if (!hitS) continue;
      }
      html += '<button class="gchip" data-g="' + esc(g) + '">' + esc(g) + '<i>' + ING_MAP[g].length + '</i></button>';
      shown++;
    }
    if (!f) html += '<span class="ingnote">共 ' + ING_LIST.length + ' 种食材，可搜索筛选，数字 = 用到它的菜数</span>';
    box.innerHTML = html;
  }
  function setFridge(on) {
    if (FRIDGE_MODE === on) return;
    FRIDGE_MODE = on;
    if (!on) FRIDGE_SEL = {};
    var b = document.getElementById('fridgeBtn');
    if (b) { b.classList.toggle('on', on); b.innerHTML = on ? '🥕 退出冰箱' : '🥕 冰箱模式'; }
    document.querySelector('.searchbar').style.display = on ? 'none' : '';
    $hint.innerHTML = on ? '冰箱模式：点选你<b>有</b>的食材，马上看能做什么、还缺什么' : DICTS[cur].hint;
    updateExtra();
    runQuery();
  }
  function ingMatch(t, sel) {
    for (var x = 0; x < sel.length; x++) {
      var cands = ING_SYN[sel[x]] || [];
      for (var y = 0; y < cands.length; y++) {
        var s = cands[y];
        if (t.indexOf(s) >= 0 || s.indexOf(t) >= 0) return true;
      }
      if (t.indexOf(sel[x]) >= 0 || sel[x].indexOf(t) >= 0) return true;
    }
    return false;
  }
  function runFridge(st) {
    var sel = Object.keys(FRIDGE_SEL);
    if (!sel.length) {
      showWelcome();
      $meta.innerHTML = '<span style="color:#a2987f">↑ 点选你有的食材（可多选），马上告诉你能做什么</span>';
      $results.innerHTML = '';
      $more.style.display = 'none';
      return;
    }
    var rows = [];
    RECIPES.forEach(function (it, i) {
      var toks = parseIng(it[4]);
      var have = 0;
      toks.forEach(function (t) { if (ingMatch(t, sel)) have++; });
      if (have > 0) rows.push([have, have / toks.length, i]);
    });
    rows.sort(function (a, b) { return b[0] - a[0] || b[1] - a[1] || a[2] - b[2]; });
    st.shown = rows.map(function (r) { return r[2]; });
    st.rendered = 0;
    $meta.innerHTML = st.shown.length ?
      '用你选的 <b>' + sel.length + '</b> 样食材能做 <b>' + st.shown.length + '</b> 道菜（先列用得最多的，绿色=食材全齐）' :
      '<span style="color:#a2987f">这几样食材组合做不出菜谱里的菜，再添几样或换几样试试</span>';
    renderResults();
    $results.firstChild && $results.firstChild.scrollIntoView({ block: 'nearest' });
  }
  function annotateFridge(from, to) {
    var sel = Object.keys(FRIDGE_SEL);
    for (var k = from; k < to; k++) {
      var el = $results.children[k];
      if (!el || !el.dataset.i) continue;
      var missToks = [];
      parseIng(RECIPES[+el.dataset.i][4]).forEach(function (t) {
        if (!ingMatch(t, sel)) missToks.push(t);
      });
      var miss = missToks.length;
      el.querySelector('.arrow').insertAdjacentHTML('beforebegin',
        '<span class="chip ' + (miss ? 'r-high' : 'r-low') + '">' + (miss ? '缺 ' + miss + ' 样' : '食材全齐') + '</span>');
      if (miss) el.querySelector('.body').insertAdjacentHTML('afterbegin',
        '<div class="sec"><span class="lab l-exc">还 缺</span><span class="txt">' + esc(missToks.join('、')) + '</span></div>');
    }
  }
  // 冰箱模式按钮 + 食材 chip 点击（委托，随 extra 重渲染可用）
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('#fridgeBtn')) { setFridge(!FRIDGE_MODE); return; }
    var c = e.target.closest('.gchip');
    if (!c) return;
    if (c.dataset.x) { setFridge(false); return; }
    if (c.dataset.c) { FRIDGE_SEL = {}; renderIngChips(''); runQuery(); return; }
    var g = c.dataset.g;
    if (!g) return;
    if (FRIDGE_SEL[g]) delete FRIDGE_SEL[g]; else FRIDGE_SEL[g] = 1;
    c.classList.toggle('active', !!FRIDGE_SEL[g]);
    runQuery();
  });

  /* ================= 图片灯箱（点图逐级放大，点背景逐级缩小，最小约1/4） ================= */
  var $imgZoom = document.getElementById('imgZoom');
  var ZOOM_STEPS = [0.25, 0.5, 1, 1.6, 2.4, 3.4];   // 相对适配屏幕的倍率，1 = 原始展示
  var zoomLevel = 2;
  function zoomApply(originX, originY) {
    var img = document.getElementById('imgZoomImg');
    img.style.transformOrigin = (originX === undefined ? 50 : originX) + '% ' + (originY === undefined ? 50 : originY) + '%';
    img.style.transform = 'scale(' + ZOOM_STEPS[zoomLevel] + ')';
    document.getElementById('zoomHint').textContent =
      '× ' + ZOOM_STEPS[zoomLevel] + '　点图片放大（以点击处为中心）· 点背景缩小 · Esc 关闭';
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if ($imgZoom.classList.contains('show')) {
      if (e.target.closest('#zoomX')) { $imgZoom.classList.remove('show'); return; }
      var img = document.getElementById('imgZoomImg');
      if (e.target === img) {                       // 点图片：放大一档，以点击处为中心
        if (zoomLevel < ZOOM_STEPS.length - 1) {
          zoomLevel++;
          var r = img.getBoundingClientRect();
          zoomApply(
            Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)),
            Math.max(0, Math.min(100, (e.clientY - r.top) / r.height * 100)));
        }
        return;
      }
      if (zoomLevel > 0) { zoomLevel--; zoomApply(); return; }   // 点背景：缩小一档
      return;
    }
    var im = e.target.closest('.dthumb');
    if (!im) return;
    document.getElementById('imgZoomImg').src = im.getAttribute('src');
    zoomLevel = 2;
    zoomApply();
    $imgZoom.classList.add('show');
  });

  // 详情图右上角按钮：默认小图靠右，点「放 大」还原全宽
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.dsmall') : null;

    if (!e.target.closest) return;

    if (!c) return;
    PSY_F = c.dataset.d || '';
    $extra.querySelectorAll('.ychip').forEach(function (x) { x.classList.toggle('active', x === c); });
    runQuery();

  function search(d, q) {
    q = q.trim().toLowerCase();
    if (!q) return null;
    var isAscii = /^[a-z0-9 '\-]+$/.test(q);
    var nq = normPy(q);
    var items = d.items;
    var hits = [];
    for (var i = 0; i < items.length; i++) {
      var s = d.score(items[i], i, q, nq, isAscii);
      if (s > 0) hits.push([s, i]);
    }
    hits.sort(function (a, b) { return b[0] - a[0] || a[1] - b[1]; });
    return hits.map(function (h) { return h[1]; });
  }

  function renderResults() {
    var st = TABST[cur];
    $results.innerHTML = '';
    var n = Math.min(st.rendered + PAGE, st.shown.length);
    var d = DICTS[cur];
    var from = st.rendered;
    for (var k = from; k < n; k++) $results.appendChild(rowEl(d, st.shown[k], false));
    st.rendered = n;
    if (FRIDGE_MODE && cur === 'recipe') annotateFridge(from, n);
    $more.style.display = st.rendered < st.shown.length ? 'block' : 'none';
  }

  function runQuery() {
    var d = DICTS[cur], st = TABST[cur];
    st.q = $q.value;
    refreshFilters();
    $card.innerHTML = '';
    if (FRIDGE_MODE && cur === 'recipe') { runFridge(st); return; }
    if (cur === 'term' && !$q.value.trim() && TERM_F) {
      var tl = [];
      for (var ti = 0; ti < TERMS.length; ti++) if (TERMS[ti][2] === TERM_F) tl.push(ti);
      st.shown = tl;
      st.rendered = 0;
      $meta.innerHTML = '「' + esc(TERM_F) + '」领域共 <b>' + tl.length + '</b> 条术语';
      renderResults();
      return;
    }
    if (cur === 'psy' && !$q.value.trim() && PSY_F) {
      var pl = [];
      for (var pi = 0; pi < PSY.length; pi++) if (PSY[pi][2] === PSY_F) pl.push(pi);
      st.shown = pl;
      st.rendered = 0;
      $meta.innerHTML = '「' + esc(PSY_F) + '」分类共 <b>' + pl.length + '</b> 条词条';
      renderResults();
      return;
    }
    if (cur === 'eng' && !$q.value.trim() && ENG_F) {
      var el = [];
      for (var ei = 0; ei < ENG.length; ei++) {
        if (ENG_F === 'word' ? !isPhrase(ENG[ei]) : isPhrase(ENG[ei])) el.push(ei);
      }
      st.shown = el;
      st.rendered = 0;
      $meta.innerHTML = (ENG_F === 'phrase' ? '共 <b>' + el.length + '</b> 个词组' : '共 <b>' + el.length + '</b> 个单词') + '（按常用度排序，点击展开）';
      renderResults();
      return;
    }
    if (cur === 'rare' && !$q.value.trim() && (RARE_F.r || RARE_F.s || RARE_F.p1 || RARE_F.p2)) {
      var all = [];
      for (var ri = 0; ri < RARE.length; ri++) {
        var sc = rareScore(RARE[ri]);
        if (sc > 0) all.push([sc, RARE[ri][3], ri]);
      }
      all.sort(function (a, b) { return b[0] - a[0] || a[1] - b[1] || a[2] - b[2]; });
      st.shown = all.map(function (x) { return x[2]; });
      st.rendered = 0;
      $meta.innerHTML = '筛得 <b>' + all.length + '</b> 字（匹配度优先，同分按笔画排序）';
      renderResults();
      return;
    }
    var idx = search(d, $q.value);
    if (idx === null) { showWelcome(); return; }
    st.shown = idx;
    st.rendered = 0;
    if (!st.shown.length) {
      $meta.innerHTML = d.emptyMsg;
      $results.innerHTML = '';
      $more.style.display = 'none';
      return;
    }
    $meta.innerHTML = '共找到 <b>' + st.shown.length.toLocaleString() + '</b> 条' +
      (st.shown.length > PAGE ? '（先显示 ' + PAGE + ' 条，点击结果可展开）' : '，点击可展开');
    renderResults();
    if (st.shown.length === 1 && d.items[st.shown[0]][0].toLowerCase() === $q.value.trim().toLowerCase()) {
      $results.firstChild.classList.add('open');
    }
  }

  function showCard(d, idx, tag) {
    var it = d.items[idx];
    $card.innerHTML = '<div class="feature-card"><div class="tag">' + tag + '</div>' +
      starHTML(d.key, it[0]) + d.detail(it, idx) + '</div>';
  }

  function showWelcome() {
    var d = DICTS[cur];
    var t = new Date();
    var seed = t.getFullYear() * 372 + (t.getMonth() + 1) * 31 + t.getDate();
    showCard(d, d.todayPick(seed), d.todayLabel(t));
    $meta.innerHTML = '';
    $results.innerHTML = '';
    $more.style.display = 'none';
  }

  function showRandom() {
    var d = DICTS[cur];
    var idx = Math.floor(Math.random() * d.items.length);
    showCard(d, idx, '随手一翻');
    $card.firstChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  var timer = null;
  $q.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(runQuery, 180);
  });
  $q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(timer); runQuery(); }
    if (e.key === 'Escape') { $q.value = ''; runQuery(); $q.blur(); }
  });
  document.getElementById('go').addEventListener('click', runQuery);
  document.getElementById('qClear').addEventListener('click', function () {
    $q.value = '';
    runQuery();
    $q.focus();
  });
  document.getElementById('random').addEventListener('click', showRandom);
  $more.addEventListener('click', renderResults);
  document.getElementById('favBtn').addEventListener('click', openFav);
  // 今日控糖按钮在菜谱页顶部份量旁，随 extra 重新渲染，用委托绑定
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#diaBtn')) openDiary();
  });

  // 快捷键
  document.addEventListener('keydown', function (e) {
    if ($imgZoom.classList.contains('show')) {
      if (e.key === 'Escape') $imgZoom.classList.remove('show');
      return;
    }
    var favOpen = $favOverlay.classList.contains('show');
    var diaOpen = $diaOverlay.classList.contains('show');
    if (!favOpen && !diaOpen) {
      if (e.key === '/' && document.activeElement !== $q) { e.preventDefault(); $q.focus(); $q.select(); }
      return;
    }
    if (e.key === 'Escape') { if (diaOpen) closeDiary(); else closeFav(); return; }
    if (favView === 'review') {
      if (e.key === ' ') { e.preventDefault(); flipCard(); }
      else if (e.key === 'ArrowRight') { rvGo(1); }
      else if (e.key === 'ArrowLeft') { rvGo(-1); }
    }
  });
  $favOverlay.addEventListener('click', function (e) { if (e.target === $favOverlay) closeFav(); });

  // 初始化
  var d0 = DICTS[cur];
  $q.placeholder = d0.placeholder;
  $hint.innerHTML = d0.hint;
  updateFavBadge();
  updateExtra();
  showWelcome();
})();
</script>
</body>
</html>
